[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*/models.py" = ["RUF012"]
"*/admin.py" = ["RUF012"]
"*/0001_initial.py" = ["RUF012"]
"*/0002_seed_branch_types.py" = ["RUF012"]
"*/migrations/0002_docnumbersequence.py" = ["RUF012"]
"*/migrations/0004_seed_party_sub_types.py" = ["RUF012"]
"*/serializers.py" = ["RUF012"]
"*/migrations/*" = ["E501"]
